<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWA Store</title>
  
  <!-- PWA Settings -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
    header { background: #1e293b; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    h1 { font-size: 1.25rem; font-weight: 600; color: #38bdf8; }
    
    #install-btn {
      background: #2563eb; color: white; border: none; padding: 0.5rem 1rem;
      border-radius: 0.5rem; font-weight: 500; cursor: pointer; display: none;
      transition: background 0.2s;
    }
    #install-btn:hover { background: #1d4ed8; }

    main { padding: 1.5rem; max-width: 800px; width: 100%; margin: 0 auto; flex: 1; }
    .section-title { font-size: 1.1rem; margin-bottom: 1rem; color: #94a3b8; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    
    .card {
      background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem;
      padding: 1.25rem; display: flex; flex-direction: column; justify-content: space-between;
    }
    .card h3 { font-size: 1rem; margin-bottom: 0.5rem; }
    .card p { font-size: 0.85rem; color: #94a3b8; margin-bottom: 1rem; word-break: break-word; }
    
    .btn-download {
      background: #0f172a; color: #38bdf8; border: 1px solid #38bdf8;
      padding: 0.5rem; border-radius: 0.375rem; text-align: center;
      text-decoration: none; font-size: 0.85rem; font-weight: 500; display: block;
      transition: all 0.2s;
    }
    .btn-download:hover { background: #38bdf8; color: #0f172a; }

    footer { text-align: center; padding: 1rem; color: #64748b; font-size: 0.8rem; border-top: 1px solid #334155; }
  </style>
</head>
<body>

  <header>
    <h1>PWA Store</h1>
    <button id="install-btn">Установить Store</button>
  </header>

  <main>
    <div class="section-title">Каталог приложений</div>
    <div class="grid" id="app-grid">
      <p style="color: #64748b;">Загрузка каталога...</p>
    </div>
  </main>

  <footer>
    GitHub Pages PWA Store &copy; 2026
  </footer>

  <script>
    // 1. Регистрация Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    // 2. Логика установки самого PWA Store
    let deferredPrompt;
    const installBtn = document.getElementById('install-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        installBtn.style.display = 'none';
      }
      deferredPrompt = null;
    });

    // 3. Загрузка каталога из apps.json
    async function loadApps() {
      const appGrid = document.getElementById('app-grid');
      try {
        const response = await fetch('./apps.json');
        const apps = await response.json();

        if (!apps || apps.length === 0) {
          appGrid.innerHTML = '<p style="color: #64748b; grid-column: 1/-1;">Каталог пуст.</p>';
          return;
        }

        appGrid.innerHTML = apps.map(app => `
          <div class="card">
            <div>
              <h3>${app.name}</h3>
              <p>${app.description}</p>
            </div>
            <a href="${app.url}?store=yes" target="_blank" class="btn-download">Открыть / Установить</a>
          </div>
        `).join('');
      } catch (err) {
        appGrid.innerHTML = '<p style="color: #fca5a5; grid-column: 1/-1;">Ошибка загрузки каталога apps.json</p>';
      }
    }

    loadApps();
  </script>
</body>
</html>
